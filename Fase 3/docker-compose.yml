version: "3.9"

services:
  backend:
    image: docker.io/airflowsystem/backend:latest
    container_name: backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./backend/.env
    networks:
      - proyecto_network
    depends_on:
      - redis

  frontend:
    image: docker.io/airflowsystem/frontend:latest
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - VITE_API_URL=http://localhost:3000/api
    networks:
      - proyecto_network
    depends_on:
      - backend

  redis:
    image: redis:7.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - proyecto_network

networks:
  proyecto_network:
