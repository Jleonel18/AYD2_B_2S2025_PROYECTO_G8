name: CI/CD

on:
  push:
    branches:
      - develop
      - 'release/**'
      - main

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------
  # BUILD
  # -----------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Contruyendo imagen y subiendo a Docker Hub BACKEND
        run: |
          IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend
          docker build -f "./Fase 3/backend/Dockerfile" -t ${IMAGE}:latest "./Fase 3/backend"
          docker push ${IMAGE}:latest

      - name: Contruyendo imagen y subiendo a Docker Hub FRONTEND
        run: |
          IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend
          docker build -f "./Fase 3/frontend/Dockerfile" -t ${IMAGE}:latest --build-arg VITE_API_URL=http://backend:3000/api "./Fase 3/frontend"
          docker push ${IMAGE}:latest

  # -----------------------
  # TEST
  # -----------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Fase 3/backend/package-lock.json'

      - name: Haciendo test de Backend
        run: |
          cd "Fase 3/backend"
          npm ci
          npm test

  # -----------------------
  # DEPLOY
  # -----------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy a VM en Azure
        uses: appleboy/ssh-action@v1.6.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest

            cat > docker-compose.yml <<'EOF'
            version: "3.9"
            services:
              backend:
                image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
                container_name: backend
                restart: unless-stopped
                ports:
                  - "3000:3000"
                environment:
                  - REDIS_HOST=redis
                  - REDIS_PORT=6379
                env_file:
                  - .env.backend
                networks:
                  - proyecto_network
                depends_on:
                  - redis

              frontend:
                image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
                container_name: frontend
                restart: unless-stopped
                ports:
                  - "8080:8080"
                env_file:
                  - .env.frontend
                networks:
                  - proyecto_network
                depends_on:
                  - backend

              redis:
                image: redis:7.0-alpine
                container_name: redis
                restart: unless-stopped
                ports:
                  - "6379:6379"
                networks:
                  - proyecto_network

            networks:
              proyecto_network:
            EOF

            docker compose down || true
            docker compose up -d --remove-orphans